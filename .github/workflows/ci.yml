name: CI

on:
  push:
    branches: [main]
    # macOS minutes are expensive on private repos; skip docs-only pushes.
    paths-ignore: ["**.md", "docs/**", "assets/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple Silicon, like the only machine yin targets.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # rustup no longer installs rust-toolchain.toml's toolchain on demand.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
