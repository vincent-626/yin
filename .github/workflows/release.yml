name: Release

# Push a tag matching the version in crates/yin/Cargo.toml, e.g. v0.1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          version=$(grep -m1 '^version' crates/yin/Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match version ${version}" >&2
            exit 1
          fi

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build yin.app
        run: script/bundle

      - name: Package
        # A fixed asset name, so releases/latest/download/... always works.
        run: |
          cd target/release/bundle
          ditto -c -k --keepParent yin.app yin-macos-arm64.zip
          shasum -a 256 yin-macos-arm64.zip > yin-macos-arm64.zip.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "yin ${GITHUB_REF_NAME}" \
            --generate-notes \
            target/release/bundle/yin-macos-arm64.zip \
            target/release/bundle/yin-macos-arm64.zip.sha256
