name: Release

# Push a tag matching the version in crates/yin/Cargo.toml, e.g. v0.1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          version=$(grep -m1 '^version' crates/yin/Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match version ${version}" >&2
            exit 1
          fi

      - name: Read the release notes from CHANGELOG.md
        run: script/release-notes "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Install cargo-about
        run: command -v cargo-about || cargo install cargo-about --version 0.9.3 --locked --features cli

      - name: Build yin.app
        env:
          YIN_REQUIRE_NOTICES: "1"
        run: script/bundle

      - name: Package
        # A fixed asset name, so releases/latest/download/... always works.
        run: |
          cd target/release/bundle
          ditto -c -k --keepParent yin.app yin-macos-arm64.zip
          shasum -a 256 yin-macos-arm64.zip > yin-macos-arm64.zip.sha256
          cp yin.app/Contents/Resources/THIRD_PARTY_LICENSES.txt .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "yin ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            target/release/bundle/yin-macos-arm64.zip \
            target/release/bundle/yin-macos-arm64.zip.sha256 \
            target/release/bundle/THIRD_PARTY_LICENSES.txt
