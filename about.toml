# cargo-about: licence notices for what is compiled into yin.app.
# Regenerate with script/notices.
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# yin's own crates (publish = false) are covered by its LICENSE.
private = { ignore = true }
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
]
