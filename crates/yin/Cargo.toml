[package]
name = "yin"
version = "0.3.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
yin_fs.workspace = true
yin_git.workspace = true
yin_lsp.workspace = true
async-channel = "2"
ignore = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[dev-dependencies]
# Headless windows and simulated input for UI tests; only enabled for tests.
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
